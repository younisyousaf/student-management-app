@if (totalPages > 0) {
  <div class="pagination-wrapper">
    <span class="pagination-count">{{ totalCount }} {{ totalCount === 1 ? 'record' : 'records' }}</span>
    <div class="pagination">
      <button type="button" (click)="previousPage()" [disabled]="isLoading || pageNumber <= 1" aria-label="Previous page"><svg lucideChevronLeft></svg></button>
      <span>Page <strong>{{ pageNumber }}</strong> of {{ totalPages }}</span>
      <button type="button" (click)="nextPage()" [disabled]="isLoading || pageNumber >= totalPages" aria-label="Next page"><svg lucideChevronRight></svg></button>
    </div>
  </div>
}
