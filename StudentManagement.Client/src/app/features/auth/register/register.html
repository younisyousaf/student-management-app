<div class="auth-page">
  <div class="auth-container">
    <h2>Create account</h2>
    <p class="auth-description">Create your Student Management account</p>
    @if (success()) {
      <p class="success">Registered! Redirecting to login...</p>
    } @else {
      <form (ngSubmit)="onSubmit()">
        <label>
          Username
          <input type="text" [ngModel]="username()" (ngModelChange)="username.set($event)" name="username" autocomplete="username" required />
        </label>
        <label>
          Email
          <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" autocomplete="email" required />
        </label>
        <label>
          Password
          <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" autocomplete="new-password" required />
        </label>
        @if (errorMessage()) {
          <p class="error">{{ errorMessage() }}</p>
        }
        <button type="submit" [disabled]="isLoading()">
          {{ isLoading() ? 'Registering...' : 'Register' }}
        </button>
      </form>
      <p>
        Already have an account?
        <a routerLink="/login">Sign in</a>
      </p>
    }
  </div>
</div>
