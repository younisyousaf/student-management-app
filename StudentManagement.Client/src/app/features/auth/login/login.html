<div class="auth-page">
  <div class="auth-container">
    <h2>
      Welcome back
    </h2>
    <p class="auth-description">
      Sign in to Student Management
    </p>
    <form (ngSubmit)="onSubmit()">
      <label>
        Username
        <input
          type="text"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
          name="username"
          autocomplete="username"
          required />
      </label>
      <label>
        Password
        <input
          type="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          autocomplete="current-password"
          required />
      </label>
      @if (errorMessage()) {
        <p class="error">
          {{ errorMessage() }}
        </p>
      }
      <button
        type="submit"
        [disabled]="isLoading()">
        {{
          isLoading()
            ? 'Signing in...'
            : 'Sign in'
        }}
      </button>
    </form>
    <p>
      No account?
      <a routerLink="/register">
        Register
      </a>
    </p>
  </div>
</div>
